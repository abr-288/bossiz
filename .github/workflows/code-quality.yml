name: Code Quality

on:
  push:
    branches: [ main, develop, prod ]
  pull_request:
    branches: [ main, prod ]

env:
  NODE_VERSION: '22'

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run type-check

    - name: ESLint check
      run: npm run lint

    - name: Prettier check
      run: npm run format:check

    - name: Check for unused dependencies
      # Exceptions documentées dans .depcheckrc
      run: npx depcheck@1

    - name: Build application
      run: npm run build

    - name: Bundle size
      run: node scripts/ci/bundle-size.mjs

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Lighthouse CI
      run: npx @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs

    - name: Upload Lighthouse results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-results
        path: .lighthouseci/
