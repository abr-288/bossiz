events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # TLS is terminated by Caddy in front of this container; the header is
        # still sent to the browser over HTTPS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), interest-cohort=()" always;

        # Allowed origins: Supabase (REST/auth/storage/realtime), Google Fonts,
        # Unsplash + avs.io (images), TravelPayouts tracking script, Stay22 widget,
        # CinetPay, api.qrserver.com (QR codes). Inline styles are needed by React
        # style props / Radix. Scripts are same-origin only (no inline JS).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://tpembars.com https://*.travelpayouts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vols.bossiz.com https://tpembars.com https://*.travelpayouts.com https://cinetpay.com https://*.cinetpay.com; frame-src 'self' https://stay22.com https://*.stay22.com https://*.cinetpay.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.cinetpay.com; frame-ancestors 'self'; upgrade-insecure-requests" always;

        # Service worker / manifest: never cache
        location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Hashed static assets: cache forever
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri /index.html;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
