    <style>
      /* Écran de chargement : le logo Conciergerie Bossiz animé (cubes qui
         tombent puis ondulent). Réutilisé par le chargement des pages (BrandLoader). */
      .loader-container {
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        font-family: Archivo, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .bz-word {
        display: flex;
        align-items: flex-end;
        gap: clamp(4px, 1.4vw, 8px);
        padding-top: 14px;
      }
      .bz-cube {
        --d: clamp(5px, 1.6vw, 9px);
        position: relative;
        width: clamp(38px, 11vw, 70px);
        height: clamp(38px, 11vw, 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-weight: 800;
        font-size: clamp(27px, 7.8vw, 50px);
        line-height: 1;
        border-radius: 4px;
        background: var(--face);
        transform: translateY(var(--y)) rotate(var(--r));
        animation: bz-drop 0.55s cubic-bezier(0.3, 1.5, 0.6, 1) both,
          bz-hop 2.4s ease-in-out 1.6s infinite;
      }
      .bz-cube::before,
      .bz-cube::after {
        content: '';
        position: absolute;
        border-radius: 3px;
      }
      .bz-cube::before {
        left: 0;
        top: calc(-1 * var(--d));
        width: 100%;
        height: var(--d);
        background: var(--top);
        transform: skewX(-45deg);
        transform-origin: bottom left;
      }
      .bz-cube::after {
        top: 0;
        right: calc(-1 * var(--d));
        width: var(--d);
        height: 100%;
        background: var(--side);
        transform: skewY(-45deg);
        transform-origin: top left;
      }
      .bz-blue { --face: #1550b9; --top: #3d7ee0; --side: #0d3a8a; }
      .bz-green { --face: #279a37; --top: #7ccb6e; --side: #1b7429; }
      .bz-orange { --face: #f6a51f; --top: #ffd65c; --side: #d9811a; }
      .bz-cube:nth-child(1) { --r: -9deg; --y: 4px; animation-delay: 0s, 1.6s; }
      .bz-cube:nth-child(2) { --r: 14deg; --y: -6px; animation-delay: 0.1s, 1.72s; }
      .bz-cube:nth-child(3) { --r: -8deg; --y: 3px; animation-delay: 0.2s, 1.84s; }
      .bz-cube:nth-child(4) { --r: 2deg; --y: -4px; animation-delay: 0.3s, 1.96s; }
      .bz-cube:nth-child(5) { --r: -3deg; --y: 0px; animation-delay: 0.4s, 2.08s; }
      .bz-cube:nth-child(6) { --r: 6deg; --y: 6px; animation-delay: 0.5s, 2.2s; }
      .bz-sub {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: clamp(14px, 4vw, 22px);
        color: #1b2a4a;
        font-weight: 700;
        font-size: clamp(18px, 5.2vw, 32px);
        animation: bz-fade 0.5s ease-out 0.8s both;
      }
      .bz-sub::before,
      .bz-sub::after {
        content: '';
        width: clamp(28px, 9vw, 52px);
        height: 3px;
        border-radius: 2px;
        background: #1b2a4a;
        transform-origin: center;
        animation: bz-line 0.5s ease-out 1s both;
      }
      @keyframes bz-drop {
        0% { opacity: 0; transform: translateY(-70px) rotate(0deg); }
        60% { opacity: 1; }
        100% { opacity: 1; transform: translateY(var(--y)) rotate(var(--r)); }
      }
      @keyframes bz-hop {
        0%, 30%, 100% { transform: translateY(var(--y)) rotate(var(--r)); }
        12% { transform: translateY(calc(var(--y) - 12px)) rotate(var(--r)); }
      }
      @keyframes bz-fade {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes bz-line {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bz-cube, .bz-sub, .bz-sub::before, .bz-sub::after { animation: none; }
      }
    </style>
