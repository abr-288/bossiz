    <style>
      .loader-container {
        background-color: #0c1524;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
      }
      .loader-logo-wrapper {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
      }
      .loader-logo {
        width: 80px;
        height: 80px;
        object-fit: contain;
        z-index: 2;
        animation: loader-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid #00F59B;
        animation: loader-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .loader-ring:nth-child(2) {
        animation-delay: 1s;
      }
      .loader-text {
        color: #ffffff;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        margin-bottom: 1.5rem;
        background: linear-gradient(135deg, #ffffff 0%, #00F59B 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .loader-bar-bg {
        width: 200px;
        height: 4px;
        background: rgba(0, 245, 155, 0.15);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }
      .loader-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 30%;
        background: #00F59B;
        border-radius: 4px;
        box-shadow: 0 0 10px rgba(0, 245, 155, 0.8);
        animation: loader-bar-anim 1.5s ease-in-out infinite;
      }
      @keyframes loader-pulse {
        0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 8px rgba(0,245,155,0.4)); }
        50% { transform: scale(0.95); opacity: 0.8; filter: drop-shadow(0 0 2px rgba(0,245,155,0.1)); }
      }
      @keyframes loader-ping {
        0% { transform: scale(0.8); opacity: 0.8; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      @keyframes loader-bar-anim {
        0% { left: -30%; }
        100% { left: 100%; }
      }
    </style>
